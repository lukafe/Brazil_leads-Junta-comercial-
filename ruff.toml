line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["S101"]
"src/psav/cli.py" = ["B008"]  # typer.Option/Argument em defaults é o padrão da lib
"src/psav/exceptions.py" = ["N818"]  # GeminiQuotaExceeded reads better without "Error" suffix
