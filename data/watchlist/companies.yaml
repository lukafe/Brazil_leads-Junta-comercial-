# Watchlist of known Brazilian crypto-market companies.
#
# Format:
#   - cnpj: "12345678000190"   # optional — digits only. Leave empty if unknown.
#     razao_social_aliases:    # alternates for fuzzy match against the corporate name
#       - "MERCADO BITCOIN"
#       - "MB SERVICOS"
#     category: exchange | tokenization | asset | bank | broker | other
#     notes: "..."
#     priority: estrategico | ativo | long_tail   # optional, defaults to ativo
#
# Pipeline behaviour:
#   1. If the company is found in the Receita Federal files (CNPJ or alias), it
#      is included in the Excel even when its corporate name does not contain
#      "SPSAV".
#   2. If it is NOT found, it still appears in the Excel under the
#      "watchlist_only" sheet — a heads-up that the company has not yet
#      created its SPSAV.
#
# You can edit this file and re-run `psav ingest receita-dump` (or use
# `psav watchlist add ...` to append entries via the CLI).

- cnpj: "18213434000111"
  razao_social_aliases:
    - "MERCADO BITCOIN"
    - "MB SERVICOS DIGITAIS"
  category: exchange
  priority: estrategico
  notes: "Largest exchange in Brazil. Confirm CNPJ — could be a holding."

